<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - Validación de formularios</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <form id="formulario" novalidate>
    <h1>Registro de usuario</h1>

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" autocomplete="given-name">
      <div class="error" id="error-nombre"></div>
    </div>

    <div class="campo">
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" autocomplete="family-name">
      <div class="error" id="error-apellido"></div>
    </div>

    <div class="campo">
      <label for="edad">Edad</label>
      <input type="number" id="edad">
      <div class="error" id="error-edad"></div>
    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="email">
      <div class="error" id="error-email"></div>
    </div>

    <fieldset>
      <legend>Sexo</legend>
      <div class="radios">
        <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
        <label><input type="radio" name="sexo" value="femenino"> Femenino</label>
      </div>
      <div class="error" id="error-sexo"></div>
    </fieldset>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="new-password">
      <div class="error" id="error-password"></div>
    </div>

    <div class="campo">
      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" autocomplete="new-password">
      <div class="error" id="error-confirmar"></div>
    </div>

    <button type="submit">Registrarse</button>
  </form>

  <!-- Alerta de éxito -->
  <div id="alerta" role="alertdialog" aria-modal="true" aria-labelledby="mensaje-alerta">
    <div class="caja">
      <p id="mensaje-alerta">Registro con éxito</p>
      <button type="button" id="btn-aceptar">Aceptar</button>
    </div>
  </div>

  <script src="validaciones.js"></script>
</body>
</html>
